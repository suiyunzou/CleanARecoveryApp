name: Android Release

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic integration guards
        run: node --test .github/scripts/auto-integrate.test.cjs
      - name: Test bundled downloader source selection
        run: python3 app/src/test/python/test_download_sources.py
      - name: Test release asset validation
        run: python3 .github/scripts/test_release_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assign increasing version
        id: version
        shell: bash
        run: |
          code=$((100000 + GITHUB_RUN_NUMBER))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=0.1.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'Missing release signing secret; refusing to publish a different certificate.' >&2
            exit 1
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build and run unit tests
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          bash gradlew :app:assembleRelease :app:testReleaseUnitTest --console=plain --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx2048m -XX:+UseSerialGC -Dfile.encoding=UTF-8'
          -PexternalServiceTests=false
          -PreleaseVersionCode="$VERSION_CODE" -PreleaseVersionName="$VERSION_NAME"
      - name: Verify and prepare universal and ABI APKs
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for variant in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk="app/build/outputs/apk/release/app-$variant-release.apk"
            if [ "$variant" = universal ]; then apk=app/build/outputs/apk/release/app-release.apk; fi
            "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              grep -qi '13ee018cfba46568d7082ee8fccea3192b3eac4339b6f2703fa90d500cc2164b' "$RUNNER_TEMP/signature.txt"
            fi
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            head -1 "$RUNNER_TEMP/badging.txt" | grep "versionCode='$VERSION_CODE'" | grep "name='com.example.cleanrecovery.musicapp'"
          done
          python3 .github/scripts/release-assets.py prepare --apk-dir app/build/outputs/apk/release --output release --code "$VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: release/*
          compression-level: 0 # APKs are already compressed; avoid recompressing five packages.
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_id }}
          path: app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  integrate:
    name: Create PR and merge tested changes
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-integrate-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const integrate = require('./.github/scripts/auto-integrate.cjs');
            await integrate({ github, context, core });

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: release
      - name: Publish completed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.build.outputs.code }}
          VERSION_NAME: ${{ needs.build.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if gh api "repos/$GH_REPO/releases/latest" > latest.json 2>/dev/null; then
            latest_code=$(python3 -c 'import json,re; print(max([int(m.group(1)) for a in json.load(open("latest.json"))["assets"] if (m:=re.fullmatch(r"CleanARecovery-([0-9]+)\.apk",a["name"]))] or [0]))')
            if [ "$latest_code" -gt "$VERSION_CODE" ]; then
              echo 'A newer version is already public; this older run will not replace Latest.'
              exit 0
            fi
          fi
          # Retries never replace an already public installation package.
          if gh release view "$tag" --json isDraft --jq '.isDraft' > existing.txt 2>/dev/null; then
            if grep -qx false existing.txt; then
              echo 'This run has already published its release.'
              exit 0
            fi
          else
            printf '浏览体验与功能更新。\n\n下载说明：\n- arm64-v8a：64 位 ARM 手机。\n- armeabi-v7a：32 位 ARM 设备。\n- x86_64 / x86：对应架构的模拟器或设备。\n- 无架构后缀：通用备用包，兼容旧版应用内更新。\n\n新版应用内更新自动选择设备支持的架构。所有安装包保留对应架构原有功能，32 位包不含 Mihomo 内核。\n\n版本号：%s\n源码提交：%s\n' "$VERSION_CODE" "$GITHUB_SHA" > notes.txt
            gh release create "$tag" --target "$GITHUB_SHA" --title "枢 $VERSION_NAME" --notes-file notes.txt --draft
          fi
          gh release upload "$tag" release/* --clobber
          # A draft has no public tag yet; its tag endpoint returns 404.
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          release_id=$(python3 -c 'import json,os; print(next(r["id"] for r in json.load(open("releases.json")) if r["tag_name"]=="v"+os.environ["VERSION_NAME"]))')
          gh api "repos/$GH_REPO/releases/$release_id" > metadata.json
          python3 .github/scripts/release-assets.py manifest --metadata metadata.json --release-dir release \
            --code "$VERSION_CODE" --repository "$GH_REPO" --version-name "$VERSION_NAME" --output update.json
          gh release upload "$tag" update.json --clobber
          gh release edit "$tag" --draft=false --latest
