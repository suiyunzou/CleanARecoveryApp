plugins {
    id "com.android.application"
}

android {
    namespace "com.example.cleanrecovery"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.cleanrecovery.musicapp"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // 让 android.util.Log 等 Android 框架方法在单元测试中返回默认值而非抛异常
            returnDefaultValues = true
        }
    }

    // Mihomo 以内置 Android 可执行内核运行。必须解压 jniLibs，ProcessBuilder
    // 才能从 applicationInfo.nativeLibraryDir 启动对应 ABI 的 libmihomo.so。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ["**/libmihomo.so"]
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.code.gson:gson:2.10.1"
    // androidx.webkit: 提供 ProxyController.setProxyOverride，用于把 WebView 流量路由到本地 SS 代理。
    // 仅此一处新增依赖，不升级既有 androidx/material/gson 版本。
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
}

/**
 * 真实数据测试任务：在电脑端 JVM 直接运行酷狗 API 真实数据测试。
 *
 * <p>使用方式：{@code gradlew.bat runRealDataTest}</p>
 *
 * <p>本任务编译主源代码后，使用 JavaExec 直接运行 RealDataTestMain，
 * 绕过 Android 框架依赖（RealDataTestMain 不依赖 android.util.Log）。</p>
 */
task runRealDataTest(type: JavaExec, dependsOn: 'compileDebugJavaWithJavac') {
    group = 'verification'
    description = '在电脑端 JVM 直接运行酷狗 API 真实数据测试'

    // 主源代码编译输出目录
    def classesDir = file('build/intermediates/javac/debug/compileDebugJavaWithJavac/classes')

    // classpath 在执行阶段解析（doFirst 中），避免配置阶段访问 debugRuntimeClasspath
    doFirst {
        def runtimeFiles = configurations.debugRuntimeClasspath.files.findAll { f ->
            f.name.startsWith('gson-')
                    || (f.name.startsWith('core-') && f.name.endsWith('.jar'))
                    || f.name.startsWith('collection-')
                    || f.name.startsWith('annotation-jvm')
                    || f.name.startsWith('core-common')
        }
        classpath = files([classesDir] + runtimeFiles)
    }

    mainClass = 'com.example.cleanrecovery.music.api.RealDataTestMain'
    workingDir = rootProject.projectDir

    // 标准输入输出直通
    standardInput = System.in
    standardOutput = System.out
    errorOutput = System.err
}

task runRemotePlaylistRealDataTest(type: JavaExec, dependsOn: 'compileDebugJavaWithJavac') {
    group = 'verification'
    description = '在电脑端 JVM 直接验证酷狗用户云歌单读取（latest_token.txt 存在时执行）'

    def classesDir = file('build/intermediates/javac/debug/compileDebugJavaWithJavac/classes')

    doFirst {
        def runtimeFiles = configurations.debugRuntimeClasspath.files.findAll { f ->
            f.name.startsWith('gson-')
                    || (f.name.startsWith('core-') && f.name.endsWith('.jar'))
                    || f.name.startsWith('collection-')
                    || f.name.startsWith('annotation-jvm')
                    || f.name.startsWith('core-common')
        }
        classpath = files([classesDir] + runtimeFiles)
    }

    mainClass = 'com.example.cleanrecovery.music.api.RemotePlaylistRealDataTestMain'
    workingDir = rootProject.projectDir

    standardInput = System.in
    standardOutput = System.out
    errorOutput = System.err
}
